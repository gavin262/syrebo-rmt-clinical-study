<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280"><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#8A5A44"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="85" font-size="34" fill="#00356B" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="15" fill="#526478" font-weight="700">二次提及／测量工具研究 · 2024</text><text x="60" y="185" font-size="46" fill="#00356B" font-weight="800">品牌出现在论文里</text><text x="60" y="245" font-size="46" fill="#00356B" font-weight="800">≠ 品牌设备被实验</text><text x="60" y="345" font-size="23" fill="#8A5A44" font-weight="700">air-guitar测量学研究｜二次提及示例</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="410" width="260" height="150" rx="16"/><rect x="350" y="410" width="260" height="150" rx="16"/><rect x="640" y="410" width="260" height="150" rx="16"/></g><g font-size="32" fill="#00356B" font-weight="800"><text x="80" y="468">10名</text><text x="370" y="468">0.82–0.99</text><text x="660" y="468">1°–9°</text></g><g font-size="16" fill="#526478"><text x="80" y="522">健康右利手受试者</text><text x="370" y="522">air-guitar重测ICC</text><text x="660" y="522">MDC95范围</text></g><rect y="620" width="960" height="350" fill="#00356B"/><text x="60" y="680" font-size="20" fill="#A9C8E8" font-weight="700">核心信息 / KEY READING</text><text x="60" y="760" font-size="44" fill="#fff" font-weight="800">自研 air-guitar</text><text x="60" y="820" font-size="40" fill="#fff" font-weight="800">SYREBO 仅在引言出现</text><text x="60" y="895" font-size="18" fill="#E8F2FB">实验设备为清迈大学自研，不是SYREBO产品；</text><text x="60" y="925" font-size="18" fill="#E8F2FB">测量学结果不能用作SYREBO设备验证证据。</text><rect x="60" y="1010" width="8" height="112" fill="#D97925"/><text x="88" y="1040" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1080" font-size="18" fill="#526478">不可计入SYREBO直接工程或临床证据。</text><text x="60" y="1180" font-size="13" fill="#526478">Kuvijitsuwan et al. · Scientific Reports · 2024</text><text x="60" y="1210" font-size="13" fill="#526478">DOI: 10.1038/s41598-024-71094-y</text></g></svg>