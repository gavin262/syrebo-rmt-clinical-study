<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280"><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#0050A0"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="85" font-size="34" fill="#00356B" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="15" fill="#526478" font-weight="700">原始临床随机对照研究 · 2024</text><text x="60" y="185" font-size="46" fill="#00356B" font-weight="800">火针＋机器人手套镜像疗法</text><text x="60" y="245" font-size="46" fill="#00356B" font-weight="800">四周随机对照研究</text><text x="60" y="345" font-size="23" fill="#0050A0" font-weight="700">羿生 SY-HR03Y｜两组均使用手套</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="410" width="260" height="150" rx="16"/><rect x="350" y="410" width="260" height="150" rx="16"/><rect x="640" y="410" width="260" height="150" rx="16"/></g><g font-size="32" fill="#00356B" font-weight="800"><text x="80" y="468">113例</text><text x="370" y="468">110例</text><text x="660" y="468">4周</text></g><g font-size="16" fill="#526478"><text x="80" y="522">随机数字表分组</text><text x="370" y="522">完成分析，每组55例</text><text x="660" y="522">两组均含手套训练</text></g><rect y="620" width="960" height="350" fill="#00356B"/><text x="60" y="680" font-size="20" fill="#A9C8E8" font-weight="700">核心信息 / KEY READING</text><text x="60" y="760" font-size="44" fill="#fff" font-weight="800">手部 FMA｜治疗后</text><text x="60" y="825" font-size="40" fill="#fff" font-weight="800">18.42±2.71 vs 13.67±2.26</text><text x="60" y="895" font-size="18" fill="#E8F2FB">观察组额外接受火针；组间优势属于组合方案，</text><text x="60" y="925" font-size="18" fill="#E8F2FB">不能全部归因于机器人手套。</text><rect x="60" y="1010" width="8" height="112" fill="#D97925"/><text x="88" y="1040" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1080" font-size="18" fill="#526478">113例随机、110例分析；仅1个月、无随访。</text><text x="60" y="1180" font-size="13" fill="#526478">张伟 等 · 亚太传统医药 20(9):73–78 · 2024</text><text x="60" y="1210" font-size="13" fill="#526478">DOI: 10.11954/ytctyy.202409014</text></g></svg>