<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280"><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#0050A0"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="85" font-size="34" fill="#00356B" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="15" fill="#526478" font-weight="700">原始临床／神经生理研究 · 2023</text><text x="60" y="185" font-size="46" fill="#00356B" font-weight="800">三周机器人手治疗：</text><text x="60" y="245" font-size="46" fill="#00356B" font-weight="800">功能结果与神经生理要分开读</text><text x="60" y="345" font-size="23" fill="#0050A0" font-weight="700">SY-HR08P｜EEG＋EMG研究</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="410" width="260" height="150" rx="16"/><rect x="350" y="410" width="260" height="150" rx="16"/><rect x="640" y="410" width="260" height="150" rx="16"/></g><g font-size="32" fill="#00356B" font-weight="800"><text x="80" y="468">3周</text><text x="370" y="468">EEG＋EMG</text><text x="660" y="468">3种</text></g><g font-size="16" fill="#526478"><text x="80" y="522">机器人手治疗</text><text x="370" y="522">脑活动与神经肌肉耦合</text><text x="660" y="522">运动模式</text></g><rect y="620" width="960" height="350" fill="#00356B"/><text x="60" y="680" font-size="20" fill="#A9C8E8" font-weight="700">核心信息 / KEY READING</text><text x="60" y="760" font-size="44" fill="#fff" font-weight="800">主动模式后 β／γ 频段</text><text x="60" y="820" font-size="44" fill="#fff" font-weight="800">EEG–EMG 相干性增加</text><text x="60" y="895" font-size="18" fill="#E8F2FB">摘要报告手功能改善有限，但整体脑活动改善；</text><text x="60" y="925" font-size="18" fill="#E8F2FB">生理机制信号不等同于长期临床获益。</text><rect x="60" y="1010" width="8" height="112" fill="#D97925"/><text x="88" y="1040" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1080" font-size="18" fill="#526478">全文待取得，样本量与效应值未补写；不能包装为确证性疗效。</text><text x="60" y="1180" font-size="13" fill="#526478">Xinhang Li et al. · ICIRA 2023, LNCS 14267</text><text x="60" y="1210" font-size="13" fill="#526478">DOI: 10.1007/978-981-99-6483-3_21</text></g></svg>