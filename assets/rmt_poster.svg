<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280" role="img" aria-labelledby="title desc">
<title id="title">SY-HR06机器人手套联合镜像疗法三组随机先导研究</title>
<desc id="desc">66例随机，52例完成分析。联合组与镜像组治疗后FMA-UE分别为37.61±11.09和23.63±12.69，p=0.006。先导研究，4周，无随访。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F4F7FB"/><stop offset="1" stop-color="#E8F2FB"/></linearGradient><style>text{font-family:Arial,'Noto Sans SC','Microsoft YaHei',sans-serif}.n{fill:#00356B}.b{fill:#0050A0}.m{fill:#526478}.w{fill:#FFF}.d{font-weight:700}.s{font-size:16px}.xs{font-size:13px}</style></defs>
<rect width="960" height="1280" fill="url(#bg)"/><rect width="960" height="10" fill="#0050A0"/>
<text x="60" y="98" class="b d" font-size="58" letter-spacing="-3">SYREBO</text><text x="900" y="65" text-anchor="end" class="n d s" letter-spacing="2">CLINICAL EVIDENCE</text><text x="900" y="90" text-anchor="end" class="n d s">ORIGINAL PAPER · 2025</text>
<text x="60" y="205" class="n d" font-size="48">机器人手套 × 镜像疗法</text><text x="60" y="270" class="b d" font-size="36">SY-HR06 三组随机先导研究</text><text x="60" y="316" class="m" font-size="18">亚急性卒中｜常规康复基础上比较MT、RT与RMT三种路径</text>
<line x1="60" y1="350" x2="900" y2="350" stroke="#00356B" stroke-width="3"/>
<text x="60" y="420" class="n d" font-size="44">3组</text><text x="60" y="452" class="m s">镜像／手套／联合</text><line x1="325" y1="375" x2="325" y2="458" stroke="#D3DEEC" stroke-width="2"/>
<text x="355" y="420" class="n d" font-size="44">4周</text><text x="355" y="452" class="m s">每周5次，每次30分钟</text><line x1="620" y1="375" x2="620" y2="458" stroke="#D3DEEC" stroke-width="2"/>
<text x="650" y="420" class="n d" font-size="44">52例</text><text x="650" y="452" class="m s">完成分析；66例最初随机</text>
<g transform="translate(60 500)"><rect width="840" height="250" rx="4" fill="#FFF" stroke="#D3DEEC"/>
<g transform="translate(30 28)"><rect width="240" height="164" fill="#EDF3F8"/><text x="0" y="-8" class="n d" font-size="25">A · MT</text><rect x="104" y="28" width="32" height="112" rx="4" fill="#D3A25F"/><circle cx="72" cy="82" r="27" fill="#0050A0"/><circle cx="168" cy="82" r="27" fill="#8FB8DC"/><path d="M72 116v42M168 116v42" stroke="#526478" stroke-width="12"/><text x="120" y="198" text-anchor="middle" class="m s">镜像治疗</text></g>
<g transform="translate(300 28)"><rect width="240" height="164" fill="#EDF3F8"/><text x="0" y="-8" class="n d" font-size="25">B · RT</text><path d="M98 112V66c0-13 17-13 17 0V38c0-14 18-14 18 0v25-37c0-14 18-14 18 0v37-28c0-14 18-14 18 0v34-18c0-14 18-14 18 0v55c0 39-23 58-52 58-31 0-49-22-49-52z" fill="#D97925"/><path d="M93 145h86l14 27H78z" fill="#00356B"/><text x="120" y="198" text-anchor="middle" class="m s">SY-HR06手套训练</text></g>
<g transform="translate(570 28)"><rect width="240" height="164" fill="#EDF3F8"/><text x="0" y="-8" class="n d" font-size="25">C · RMT</text><rect x="104" y="25" width="30" height="120" rx="4" fill="#D3A25F"/><circle cx="66" cy="84" r="25" fill="#D97925"/><circle cx="174" cy="84" r="25" fill="#8FB8DC"/><path d="M66 116v42M174 116v42" stroke="#526478" stroke-width="12"/><text x="120" y="198" text-anchor="middle" class="m s">手套联合镜像治疗</text></g></g>
<text x="60" y="786" class="m xs">三组干预示意｜A 镜像治疗　B SY-HR06手套训练　C 手套联合镜像治疗</text>
<rect y="820" width="960" height="234" fill="#00356B"/><text x="60" y="870" class="w d" font-size="22">治疗后 FMA-UE｜联合组 vs 镜像组</text><text x="900" y="870" text-anchor="end" class="w d" font-size="22">p = 0.006</text>
<text x="60" y="963" class="w d" font-size="64">37.61<tspan font-size="25"> ± 11.09</tspan><tspan fill="#A9C8E8" font-size="35">　VS　</tspan><tspan font-size="48">23.63</tspan><tspan font-size="23"> ± 12.69</tspan></text>
<text x="60" y="1018" class="w s">联合组同时接受机器人手套与镜像治疗；结果支持联合方案的初步信号，</text><text x="60" y="1043" class="w s">不能全部归因于手套单独作用。</text>
<rect x="60" y="1090" width="8" height="88" fill="#D97925"/><text x="88" y="1110" class="n d s">研究边界</text><text x="190" y="1110" class="m s">先导研究，每组完成分析16—18例；仅干预4周，无随访。</text><text x="88" y="1145" class="m s">14例退出并被排除出分析；不能据此推断长期疗效或适用于所有卒中患者。</text>
<text x="60" y="1210" class="m xs">Qian J, et al. Frontiers in Neurology. 2025;16:1602896.</text><text x="60" y="1238" class="m xs">DOI: 10.3389/fneur.2025.1602896　·　研究解读不构成医疗建议</text>
</svg>