<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280" role="img" aria-labelledby="title desc"><title id="title">SY-HR06机器人手套联合镜像疗法三组随机先导研究</title><desc id="desc">66例随机，52例完成分析。联合组与镜像组治疗后FMA-UE分别为37.61±11.09和23.63±12.69，p=0.006。先导研究，4周，无随访。</desc><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#0050A0"/><g font-family="Arial,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="90" font-size="52" fill="#0050A0" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="16" fill="#526478" font-weight="700">CLINICAL EVIDENCE · 2025</text><text x="60" y="195" font-size="48" fill="#00356B" font-weight="800">机器人手套 × 镜像疗法</text><text x="60" y="260" font-size="36" fill="#0050A0" font-weight="700">SY-HR06 三组随机先导研究</text><text x="60" y="315" font-size="18" fill="#526478">亚急性卒中｜常规康复基础上比较MT、RT与RMT三种路径</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="380" width="260" height="150" rx="16"/><rect x="350" y="380" width="260" height="150" rx="16"/><rect x="640" y="380" width="260" height="150" rx="16"/></g><g font-size="40" fill="#00356B" font-weight="800"><text x="80" y="440">3组</text><text x="370" y="440">4周</text><text x="660" y="440">52例</text></g><g font-size="16" fill="#526478"><text x="80" y="490">镜像／手套／联合</text><text x="370" y="490">每周5次，每次30分钟</text><text x="660" y="490">完成分析；66例最初随机</text></g><rect y="600" width="960" height="390" fill="#00356B"/><text x="60" y="665" font-size="20" fill="#A9C8E8" font-weight="700">治疗后 FMA-UE｜联合组 vs 镜像组</text><text x="900" y="665" text-anchor="end" font-size="22" fill="#fff" font-weight="700">p = 0.006</text><text x="60" y="770" font-size="58" fill="#fff" font-weight="800">37.61±11.09</text><text x="60" y="840" font-size="36" fill="#A9C8E8" font-weight="700">VS　23.63±12.69</text><text x="60" y="915" font-size="18" fill="#E8F2FB">联合组同时接受机器人手套与镜像治疗；结果支持联合方案的初步信号，</text><text x="60" y="945" font-size="18" fill="#E8F2FB">不能全部归因于手套单独作用。</text><rect x="60" y="1030" width="8" height="105" fill="#D97925"/><text x="88" y="1060" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1095" font-size="17" fill="#526478">先导研究，每组完成分析16—18例；仅干预4周，无随访。</text><text x="88" y="1125" font-size="17" fill="#526478">14例退出并被排除出分析；不能据此推断长期疗效。</text><text x="60" y="1200" font-size="13" fill="#526478">Qian J, et al. Frontiers in Neurology. 2025;16:1602896.</text><text x="60" y="1230" font-size="13" fill="#526478">DOI: 10.3389/fneur.2025.1602896　·　研究解读不构成医疗建议</text></g></svg>