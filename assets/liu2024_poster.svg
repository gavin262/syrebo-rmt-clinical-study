<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280"><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#5B5EA6"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="85" font-size="34" fill="#00356B" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="15" fill="#526478" font-weight="700">机制性fNIRS研究 · 2024</text><text x="60" y="185" font-size="46" fill="#00356B" font-weight="800">软体手套 × VR</text><text x="60" y="245" font-size="46" fill="#00356B" font-weight="800">脑激活研究不是疗效试验</text><text x="60" y="345" font-size="23" fill="#5B5EA6" font-weight="700">fNIRS｜20名健康者＋20名卒中患者</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="410" width="260" height="150" rx="16"/><rect x="350" y="410" width="260" height="150" rx="16"/><rect x="640" y="410" width="260" height="150" rx="16"/></g><g font-size="32" fill="#00356B" font-weight="800"><text x="80" y="468">40人</text><text x="370" y="468">3任务</text><text x="660" y="468">fNIRS</text></g><g font-size="16" fill="#526478"><text x="80" y="522">20名健康＋20名卒中</text><text x="370" y="522">RA／VR／VRA</text><text x="660" y="522">前额叶／运动皮层／枕叶</text></g><rect y="620" width="960" height="350" fill="#00356B"/><text x="60" y="680" font-size="20" fill="#A9C8E8" font-weight="700">核心信息 / KEY READING</text><text x="60" y="760" font-size="44" fill="#fff" font-weight="800">VR 与 VRA 任务</text><text x="60" y="820" font-size="44" fill="#fff" font-weight="800">诱导更广泛皮层激活</text><text x="60" y="895" font-size="18" fill="#E8F2FB">这是脑激活机制研究，不是临床功能疗效试验；</text><text x="60" y="925" font-size="18" fill="#E8F2FB">不能据此写成已证明功能恢复。</text><rect x="60" y="1010" width="8" height="112" fill="#D97925"/><text x="88" y="1040" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1080" font-size="18" fill="#526478">激活高不等于恢复好；手套品牌型号全文待核。</text><text x="60" y="1180" font-size="13" fill="#526478">P. Liu et al. · IEEE TNSRE, 32, 3848–3857 · 2024</text><text x="60" y="1210" font-size="13" fill="#526478">DOI: 10.1109/TNSRE.2024.3482470</text></g></svg>