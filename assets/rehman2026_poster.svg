<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280"><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#0050A0"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="85" font-size="34" fill="#00356B" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="15" fill="#526478" font-weight="700">原始临床随机对照研究 · 2026</text><text x="60" y="185" font-size="46" fill="#00356B" font-weight="800">机器人手套辅助</text><text x="60" y="245" font-size="46" fill="#00356B" font-weight="800">任务导向镜像治疗</text><text x="60" y="345" font-size="23" fill="#0050A0" font-weight="700">SYREBO｜亚急性卒中非盲RCT</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="410" width="260" height="150" rx="16"/><rect x="350" y="410" width="260" height="150" rx="16"/><rect x="640" y="410" width="260" height="150" rx="16"/></g><g font-size="32" fill="#00356B" font-weight="800"><text x="80" y="468">30例</text><text x="370" y="468">8周</text><text x="660" y="468">3项</text></g><g font-size="16" fill="#526478"><text x="80" y="522">预封信封随机分组</text><text x="370" y="522">每日1次，每周5次</text><text x="660" y="522">BBT／FMA-UE／ARAT</text></g><rect y="620" width="960" height="350" fill="#00356B"/><text x="60" y="680" font-size="20" fill="#A9C8E8" font-weight="700">核心信息 / KEY READING</text><text x="60" y="760" font-size="44" fill="#fff" font-weight="800">30例随机｜8周干预</text><text x="60" y="820" font-size="40" fill="#fff" font-weight="800">BBT · FMA-UE · ARAT</text><text x="60" y="895" font-size="18" fill="#E8F2FB">摘要报告组内及组间差异具有统计学意义；</text><text x="60" y="925" font-size="18" fill="#E8F2FB">具体效应值与设备型号仍需全文核对。</text><rect x="60" y="1010" width="8" height="112" fill="#D97925"/><text x="88" y="1040" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1080" font-size="18" fill="#526478">非盲、小样本；型号与具体p值全文待核。</text><text x="60" y="1180" font-size="13" fill="#526478">Abdul Rehman et al. · Hong Kong Physiotherapy Journal · 2026</text><text x="60" y="1210" font-size="13" fill="#526478">DOI: 10.1142/S1013702526500149</text></g></svg>