<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280"><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#147D7E"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="85" font-size="34" fill="#00356B" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="15" fill="#526478" font-weight="700">直接人机接口工程研究 · 2026</text><text x="60" y="185" font-size="42" fill="#00356B" font-weight="800">A模式超声 × 软体手部外骨骼</text><text x="60" y="245" font-size="46" fill="#00356B" font-weight="800">人机接口可行性探索</text><text x="60" y="345" font-size="23" fill="#147D7E" font-weight="700">主动／被动条件｜健康受试者工程研究</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="410" width="260" height="150" rx="16"/><rect x="350" y="410" width="260" height="150" rx="16"/><rect x="640" y="410" width="260" height="150" rx="16"/></g><g font-size="32" fill="#00356B" font-weight="800"><text x="80" y="468">5名</text><text x="370" y="468">7种</text><text x="660" y="468">A-mode</text></g><g font-size="16" fill="#526478"><text x="80" y="522">健康受试者</text><text x="370" y="522">标准化协议来源抓握</text><text x="660" y="522">超声人机接口</text></g><rect y="620" width="960" height="350" fill="#00356B"/><text x="60" y="680" font-size="20" fill="#A9C8E8" font-weight="700">核心信息 / KEY READING</text><text x="60" y="760" font-size="44" fill="#fff" font-weight="800">5名健康受试者</text><text x="60" y="820" font-size="44" fill="#fff" font-weight="800">7种抓握任务</text><text x="60" y="895" font-size="18" fill="#E8F2FB">探索A模式超声在主动／被动条件下识别抓握意图；</text><text x="60" y="925" font-size="18" fill="#E8F2FB">这是工程可行性研究，不是患者临床疗效研究。</text><rect x="60" y="1010" width="8" height="112" fill="#D97925"/><text x="88" y="1040" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1080" font-size="18" fill="#526478">完整准确率与设备品牌型号待全文。</text><text x="60" y="1180" font-size="13" fill="#526478">Sgambato et al. · IEEE BioRob 2026, 495–500</text><text x="60" y="1210" font-size="13" fill="#526478">DOI: 10.1109/BIOROB66782.2026.11681602</text></g></svg>