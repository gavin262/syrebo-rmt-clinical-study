<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280"><rect width="960" height="1280" fill="#EDF4FA"/><rect width="960" height="12" fill="#147D7E"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="85" font-size="34" fill="#00356B" font-weight="800">SYREBO</text><text x="900" y="70" text-anchor="end" font-size="15" fill="#526478" font-weight="700">气动源工程研究 · 2026</text><text x="60" y="185" font-size="46" fill="#00356B" font-weight="800">无电子元件气动源</text><text x="60" y="245" font-size="42" fill="#00356B" font-weight="800">软体机器人的低热近静音路径</text><text x="60" y="345" font-size="23" fill="#147D7E" font-weight="700">化学反应＋被动机械调节</text><g fill="#fff" stroke="#D3DEEC"><rect x="60" y="410" width="260" height="150" rx="16"/><rect x="350" y="410" width="260" height="150" rx="16"/><rect x="640" y="410" width="260" height="150" rx="16"/></g><g font-size="32" fill="#00356B" font-weight="800"><text x="80" y="468">7 bar</text><text x="370" y="468">6 L/min</text><text x="660" y="468">36°C／40</text><text x="660" y="505">dBA</text></g><g font-size="16" fill="#526478"><text x="80" y="522">稳态输出压力</text><text x="370" y="522">稳态流量</text><text x="660" y="545">最高温度／噪声</text></g><rect y="620" width="960" height="350" fill="#00356B"/><text x="60" y="680" font-size="20" fill="#A9C8E8" font-weight="700">核心信息 / KEY READING</text><text x="60" y="760" font-size="44" fill="#fff" font-weight="800">7 bar｜6 L/min</text><text x="60" y="820" font-size="44" fill="#fff" font-weight="800">36°C｜40 dBA</text><text x="60" y="895" font-size="18" fill="#E8F2FB">集成吸热—放热反应，以被动机械部件自动调节；</text><text x="60" y="925" font-size="18" fill="#E8F2FB">解决软体机器人供能问题，不是患者疗效问题。</text><rect x="60" y="1010" width="8" height="112" fill="#D97925"/><text x="88" y="1040" font-size="20" fill="#00356B" font-weight="700">研究边界</text><text x="88" y="1080" font-size="18" fill="#526478">台架工程性能；是否演示SYREBO设备待全文。</text><text x="60" y="1180" font-size="13" fill="#526478">Ung Heo et al. · Soft Robotics, OnlineFirst · 2026</text><text x="60" y="1210" font-size="13" fill="#526478">DOI: 10.1177/21695172261442062</text></g></svg>